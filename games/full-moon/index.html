<link rel="stylesheet" href="src/style.css">
<script src="src/game.js" defer></script>
</head>
<body>
<video id="deskvid" class="deco" muted loop playsinline preload="none" poster="assets/desk_bg_v01.webp" aria-hidden="true" tabindex="-1"></video>
<div class="deco pillar pl" aria-hidden="true"></div><div class="deco pillar pr" aria-hidden="true"></div>
<div class="deco sign" aria-hidden="true"></div>
<aside class="deco keys" aria-label="Keyboard controls"><b>Controls</b><ul><li><kbd>←</kbd><kbd>→</kbd> or mouse <span>aim</span></li><li><kbd>Space</kbd> or click <span>drop</span></li><li><kbd>P</kbd> <span>pause</span></li><li><kbd>M</kbd> <span>sound</span></li><li><kbd>F</kbd> <span>full screen</span></li></ul></aside>
<video id="celeb" muted playsinline preload="none" hidden aria-hidden="true"></video>
<div id="app">
  <canvas id="c" aria-label="Full Moon play area"></canvas>
  <div id="hud">
    <div class="row1">
      <div class="scorebox"><div id="score">0</div><div id="best">Best 0</div></div>
      <div class="hud-right">
        <span class="label">Next</span><div class="ring"><img id="nextImg" alt="Next piece"></div>
        <button id="btnFull" class="ibtn" aria-label="Full screen"></button>
        <button id="btnSound" class="ibtn" aria-label="Sound on" aria-pressed="false">♪</button>
        <button id="btnPause" class="ibtn" aria-label="Pause">II</button>
      </div>
    </div>
    <div class="row2"><div id="prog" aria-label="Pieces made so far. The dashed one is your next goal."></div><div id="goal"></div></div>
    <span class="sr" id="modeLabel">Full Moon</span>
  </div>
  <div id="ticket" hidden></div>
  <div id="banner" role="status" aria-live="polite"></div>
  <div id="overlay" hidden></div>
  <div id="loading">Warming up the café…</div>
</div>
</body>
</html>
