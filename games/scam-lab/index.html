<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TODDY: Scam Lab</title>
<meta name="description" content="A cosy detective game about spotting crypto scams. Sniff out the red flags, and don't cry wolf at the honest ones.">
<meta name="theme-color" content="#17112a">
<link rel="canonical" href="https://toddy.meme/games/scam-lab/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TODDY">
<meta property="og:url" content="https://toddy.meme/games/scam-lab/">
<meta property="og:title" content="TODDY: Scam Lab (beta)">
<meta property="og:description" content="A cosy detective game about spotting crypto scams. Free, no account, no wallet.">
<meta property="og:image" content="https://toddy.meme/games/scam-lab/assets/share_scamlab_v04.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Toddy with a magnifying glass beside the Scam Lab corkboard">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@ToddyCoin">
<meta name="twitter:title" content="TODDY: Scam Lab (beta)">
<meta name="twitter:description" content="Spot the crypto scam. Don't cry wolf at the honest ones.">
<meta name="twitter:image" content="https://toddy.meme/games/scam-lab/assets/share_scamlab_v04.jpg">
<link rel="stylesheet" href="src/style.css">
<script type="module" src="src/main.js"></script>
</head>
<body>

<main id="stage">
  <img id="bg" class="bg" src="assets/title_bg.webp" alt="">
  <div id="hud" hidden>
    <button class="chip" id="btn-quit" type="button" aria-label="Back to case files">‹</button>
    <span id="hud-case"></span>
    <span id="hud-time">0:00</span>
    <button class="chip" id="btn-mute" type="button" aria-label="Sound">🔊</button>
    <button class="chip" id="btn-hint" type="button">Hint −50</button>
  </div>
  <div id="board" aria-label="Case board" aria-live="polite" hidden></div>
  <div id="board-count" hidden></div>
  <div id="toddy" hidden><div id="toddy-say" class="say" role="status" hidden></div></div>
  <div id="react" hidden aria-hidden="true"><img alt=""></div>
  <div id="mirage-peek" hidden aria-hidden="true"></div>
  <div id="phone" hidden><div class="screen" id="screen"></div></div>
  <section id="page" class="overlay" hidden></section>
  <section id="milo" class="overlay" hidden aria-label="Milo"></section>
  <section id="lens" class="overlay" hidden role="dialog" aria-label="Sniff lens"></section>
  <section id="decide" class="overlay" hidden role="dialog" aria-label="Decide"></section>
  <section id="scene" class="overlay" hidden aria-label="What happened"></section>
  <section id="debrief" class="overlay" hidden aria-label="Debrief"></section>
  <section id="quick" class="overlay" hidden role="dialog" aria-label="Question"></section>
  <section id="result" class="overlay" hidden aria-label="Result"></section>
  <section id="sheet" class="overlay" hidden role="dialog" aria-label="Share"></section>
  <div id="build"></div>
</main>

</body>
</html>
