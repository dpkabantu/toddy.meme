<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TODDY Echo Night (private test)</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14102e">
<link rel="stylesheet" href="src/style.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Echo Night play area"></canvas>
  <div id="hud" hidden>
    <div class="row">
      <div id="title">Night 1 · Loop 1</div>
      <div id="helpers">Toddys 1</div>
      <div id="served">Served 0 / 2</div>
    </div>
    <div id="timer" aria-label="Time left in this loop"><div id="timerFill"></div></div>
  </div>
  <div id="bar" hidden>
    <button id="btnRedo" class="sbtn" type="button">Redo loop</button>
    <button id="btnEnd" class="sbtn" type="button">End loop</button>
    <button id="btnMenu" class="sbtn" type="button">Menu</button>
    <button id="btnSound" class="sbtn" type="button" aria-pressed="true">♪</button>
  </div>
  <div id="banner" role="status" aria-live="polite"></div>
  <div id="overlay"></div>
</div>
</body>
</html>
