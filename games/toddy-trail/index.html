<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TODDY Trail (test)</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14102e">
<link rel="canonical" href="https://toddy.meme/games/toddy-trail/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="src/style.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Toddy Trail play area"></canvas>
  <div id="hud">
    <div id="served">Served 0 / 3</div>
    <div id="lantern" aria-label="Lanterns: time left"><div id="lanternFill"></div></div>
    <button id="btnFull" class="ibtn" aria-label="Full screen" aria-pressed="false">⛶</button>
    <button id="btnSound" class="ibtn" aria-label="Sound on" aria-pressed="true">♪</button>
  </div>
  <div id="banner" role="status" aria-live="polite"></div>
  <div id="overlay"></div>
</div>
</body>
</html>
