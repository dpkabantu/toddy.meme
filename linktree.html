<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0" />
  <title>$TODDY — All Links</title>
  <meta name="description"
        content="All official $TODDY links —
        Website, Twitter, Telegram, Instagram,
        TikTok, Medium, Reddit, Discord." />
  <link rel="icon" type="image/png"
        href="assets/coin-logo.png" />
  <link rel="preconnect"
        href="https://fonts.googleapis.com" />
  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet" />

  <style>
    /* ========================================
       RESET & BASE
       ======================================== */
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
    }
    :root {
      --gold:       #C9A84C;
      --gold-light: #F0C96B;
      --purple:     #9945FF;
      --brown:      #1A0A00;
      --brown2:     #2C1500;
      --brown3:     #3d1900;
      --trunk:      #5C3317;
      --trunk-dark: #3B2008;
      --leaf:       #2D5A1B;
      --leaf-dark:  #1A3A0E;
      --cherry:     #8B1A1A;
      --cherry-hi:  #C0392B;
      --black:      #050505;
      --white:      #ffffff;
    }

    html, body {
      min-height: 100vh;
      background: var(--brown);
      font-family: 'Playfair Display', serif;
      color: var(--white);
      overflow-x: hidden;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 60%,
          rgba(153,69,255,0.07) 0%,
          transparent 55%),
        radial-gradient(ellipse at 80% 20%,
          rgba(201,168,76,0.05) 0%,
          transparent 55%);
      pointer-events: none; z-index: 0;
    }

    /* Sparkle canvas */
    #lt-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }

    /* ========================================
       PAGE WRAPPER
       ======================================== */
    .lt-wrap {
      position: relative; z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 44px 24px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ========================================
       HEADER
       ======================================== */
    .lt-logo {
      width: 82px; height: 82px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      box-shadow:
        0 0 0 6px rgba(201,168,76,0.1),
        0 0 28px rgba(201,168,76,0.4);
      margin-bottom: 14px;
      object-fit: cover;
    }
    .lt-name {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem; font-weight: 700;
      color: var(--gold); margin-bottom: 5px;
      text-align: center; letter-spacing: 1px;
    }
    .lt-tagline {
      font-size: 0.88rem; opacity: 0.65;
      text-align: center; font-style: italic;
      line-height: 1.5; margin-bottom: 6px;
    }
    .lt-divider {
      width: 50px; height: 2px;
      background: linear-gradient(
        90deg, transparent,
        var(--gold), transparent);
      margin-bottom: 32px; border-radius: 2px;
    }

    /* ========================================
       TREE LABEL
       ======================================== */
    .lt-tree-label {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      color: rgba(201,168,76,0.6);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 14px;
      text-align: center;
    }

    /* ========================================
       COFFEE TREE CONTAINER
       ======================================== */
    .lt-tree-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    /* The tree SVG scales with the container */
    .lt-tree-svg {
      width: 100%;
      max-width: 480px;
      height: auto;
      overflow: visible;
      /* Gentle sway on the whole canopy */
      animation: treeSway 6s
        ease-in-out infinite;
      transform-origin: 50% 95%;
    }

    @keyframes treeSway {
      0%, 100% { transform: rotate(0deg); }
      25%       { transform: rotate(0.8deg); }
      75%       { transform: rotate(-0.8deg); }
    }

    /* ========================================
       CHERRY LINKS — the clickable fruits
       Each <a> wraps a <circle> + <svg logo>
       ======================================== */
    .cherry-link {
      cursor: pointer;
    }

    /* Cherry circle base */
    .cherry-base {
      fill: var(--cherry);
      stroke: rgba(255,255,255,0.15);
      stroke-width: 1.5;
      transition: all 0.3s ease;
      filter: drop-shadow(
        0 3px 8px rgba(0,0,0,0.5));
    }

    /* Cherry logo icon inside */
    .cherry-icon {
      fill: rgba(255,255,255,0.9);
      pointer-events: none;
    }

    /* Cherry hover — via SVG class toggle
       We use CSS :hover on the <a> wrapper */
    .cherry-link:hover .cherry-base {
      fill: var(--gold);
      stroke: var(--gold-light);
      stroke-width: 2;
      filter:
        drop-shadow(0 0 14px rgba(201,168,76,0.8))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
      transform-origin: center;
    }

    .cherry-link:hover .cherry-icon {
      fill: var(--black);
    }

    /* Platform-specific hover colours */
    .cherry-twitter:hover .cherry-base {
      fill: #000000; stroke: #ffffff;
      filter:
        drop-shadow(0 0 14px rgba(255,255,255,0.5))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }
    .cherry-twitter:hover .cherry-icon {
      fill: #ffffff;
    }

    .cherry-telegram:hover .cherry-base {
      fill: #0088cc; stroke: #4dcaf7;
      filter:
        drop-shadow(0 0 14px rgba(0,136,204,0.7))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }

    .cherry-instagram:hover .cherry-base {
      fill: #e1306c; stroke: #f77ab4;
      filter:
        drop-shadow(0 0 14px rgba(225,48,108,0.7))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }

    .cherry-tiktok:hover .cherry-base {
      fill: #010101; stroke: #69c9d0;
      filter:
        drop-shadow(0 0 14px rgba(105,201,208,0.7))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }
    .cherry-tiktok:hover .cherry-icon {
      fill: #69c9d0;
    }

    .cherry-medium:hover .cherry-base {
      fill: #000000; stroke: rgba(255,255,255,0.6);
      filter:
        drop-shadow(0 0 14px rgba(255,255,255,0.3))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }
    .cherry-medium:hover .cherry-icon {
      fill: #ffffff;
    }

    .cherry-reddit:hover .cherry-base {
      fill: #ff4500; stroke: #ff8060;
      filter:
        drop-shadow(0 0 14px rgba(255,69,0,0.7))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }

    .cherry-discord:hover .cherry-base {
      fill: #5865f2; stroke: #8fa1ff;
      filter:
        drop-shadow(0 0 14px rgba(88,101,242,0.7))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }

    .cherry-dex:hover .cherry-base {
      fill: var(--gold); stroke: var(--gold-light);
      filter:
        drop-shadow(0 0 14px rgba(201,168,76,0.8))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }
    .cherry-dex:hover .cherry-icon {
      fill: var(--black);
    }

    /* ========================================
       PLATFORM LABELS BELOW TREE
       ======================================== */
    .lt-labels {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 14px;
      margin-bottom: 36px;
      max-width: 480px;
    }

    .lt-label-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      padding: 5px 12px;
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 20px;
      background: rgba(201,168,76,0.04);
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .lt-label-item:hover {
      color: var(--gold);
      border-color: rgba(201,168,76,0.5);
      background: rgba(201,168,76,0.1);
      transform: translateY(-2px);
    }

    .lt-label-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--cherry);
      flex-shrink: 0;
    }

    /* ========================================
       FOOTER
       ======================================== */
    .lt-footer {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .lt-back {
      display: inline-flex;
      align-items: center; gap: 6px;
      color: var(--gold); text-decoration: none;
      font-size: 0.88rem; font-weight: 600;
      opacity: 0.72;
      border: 1px solid rgba(201,168,76,0.3);
      padding: 8px 20px; border-radius: 20px;
      transition: opacity 0.3s ease,
                  background 0.3s ease;
    }
    .lt-back:hover {
      opacity: 1;
      background: rgba(201,168,76,0.1);
    }

    .lt-copyright {
      font-size: 0.76rem; opacity: 0.35;
    }

    /* ========================================
       TOOLTIP on cherry hover (CSS only)
       ======================================== */
    .cherry-link {
      position: relative;
    }

    /* ========================================
       MOBILE SCALING
       ======================================== */
    @media (max-width: 480px) {
      .lt-wrap { padding: 36px 12px 48px; }
      .lt-logo { width: 68px; height: 68px; }
      .lt-name { font-size: 1.5rem; }
      /* Tree already scales via SVG viewBox */
    }

    @media (max-width: 360px) {
      .lt-labels { gap: 6px 10px; }
      .lt-label-item { font-size: 0.72rem; padding: 4px 9px; }
    }
  </style>
</head>

       - Sub-branches: shorter curves

<!-- Sparkle particles — matching main site -->
<script>
(function() {
  var canvas = document.getElementById('lt-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize,
    { passive: true });

  var pts = [];
  var TOTAL = 50;

  function mkPt() {
    return {
      x:    Math.random() * W,
      y:    H + 4,
      r:    Math.random() * 2 + 0.5,
      vx:   (Math.random() - 0.5) * 0.35,
      vy:   -(Math.random() * 0.55 + 0.15),
      o:    Math.random() * 0.55 + 0.1,
      d:    Math.random() * 0.0022 + 0.001,
      gold: Math.random() > 0.5
    };
  }

  /* Seed across full page height */
  for (var i = 0; i < TOTAL; i++) {
    var p = mkPt();
    p.y = Math.random() * H;
    pts.push(p);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var j = 0; j < pts.length; j++) {
      var p = pts[j];
      p.x += p.vx;
      p.y += p.vy;
      p.o -= p.d;
      if (p.o <= 0 || p.y < -8) {
        pts[j] = mkPt();
        continue;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.gold
        ? 'rgba(255,215,0,' + p.o + ')'
        : 'rgba(153,69,255,' + p.o + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
