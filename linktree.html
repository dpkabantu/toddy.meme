<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0" />
  <title>$TODDY — All Links</title>
  <meta name="description"
        content="All official $TODDY links —
        Website, Twitter, Telegram, Instagram,
        TikTok, Medium, Reddit, Discord." />
  <link rel="icon" type="image/png"
        href="assets/coin-logo.png" />
  <link rel="preconnect"
        href="https://fonts.googleapis.com" />
  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet" />
  <style>

/* ==========================================
   RESET
   ========================================== */
*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
}

/* ==========================================
   VARIABLES — match main site
   ========================================== */
:root {
  --gold:        #C9A84C;
  --gold-light:  #F0C96B;
  --gold-dark:   #8B6914;
  --purple:      #9945FF;
  --brown:       #1A0A00;
  --brown2:      #2C1500;
  --brown3:      #3d1900;
  --black:       #050505;
  --white:       #ffffff;
  /* Coffee tree colours */
  --trunk:       #5C3317;
  --trunk-dark:  #3B1F0A;
  --branch:      #6B3A1F;
  --leaf:        #2D5A1B;
  --leaf-light:  #3D7A25;
  --cherry:      #8B1A1A;
  --cherry-ripe: #C0392B;
  --stem:        #4A7C2F;
}

/* ==========================================
   BASE
   ========================================== */
html, body {
  min-height: 100vh;
  background: var(--brown);
  font-family: 'Playfair Display', serif;
  color: var(--white);
  overflow-x: hidden;
}

/* Ambient glow */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 60%,
      rgba(153,69,255,0.06) 0%,
      transparent 55%),
    radial-gradient(ellipse at 80% 20%,
      rgba(201,168,76,0.05) 0%,
      transparent 55%);
  pointer-events: none;
  z-index: 0;
}

/* ==========================================
   SPARKLE CANVAS
   ========================================== */
#lt-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ==========================================
   WRAPPER
   ========================================== */
.lt-wrap {
  position: relative;
  z-index: 1;
  max-width: 540px;
  margin: 0 auto;
  padding: 48px 24px 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ==========================================
   HEADER
   ========================================== */
.lt-logo {
  width: 86px; height: 86px;
  border-radius: 50%;
  border: 3px solid var(--gold);
  box-shadow:
    0 0 0 5px rgba(201,168,76,0.12),
    0 0 28px rgba(201,168,76,0.4);
  margin-bottom: 14px;
  object-fit: cover;
}

.lt-name {
  font-family: 'Cinzel', serif;
  font-size: 1.85rem;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 6px;
  text-align: center;
  letter-spacing: 1px;
}

.lt-tagline {
  font-size: 0.88rem;
  opacity: 0.65;
  text-align: center;
  margin-bottom: 8px;
  font-style: italic;
  line-height: 1.5;
}

.lt-divider {
  width: 55px; height: 2px;
  background: linear-gradient(
    90deg, transparent,
    var(--gold), transparent);
  border-radius: 2px;
  margin-bottom: 10px;
}

/* ==========================================
   TREE INTRO LABEL
   ========================================== */
.lt-tree-label {
  font-size: 0.78rem;
  color: rgba(201,168,76,0.6);
  text-align: center;
  margin-bottom: 20px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* ==========================================
   COFFEE TREE CONTAINER
   ========================================== */
.coffee-tree {
  position: relative;
  width: 340px;
  height: 420px;
  margin: 0 auto 10px;
  animation: treeSway 4s ease-in-out
    infinite;
  transform-origin: bottom center;
  flex-shrink: 0;
}

@keyframes treeSway {
  0%, 100% { transform: rotate(0deg); }
  25%       { transform: rotate(0.8deg); }
  75%       { transform: rotate(-0.8deg); }
}

/* ==========================================
   TRUNK
   ========================================== */
.tree-trunk {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 28px;
  height: 200px;
  background: linear-gradient(
    180deg,
    var(--trunk) 0%,
    var(--trunk-dark) 100%);
  border-radius: 14px 14px 8px 8px;
}

/* Trunk texture lines */
.tree-trunk::before {
  content: '';
  position: absolute;
  left: 8px; top: 20px;
  width: 4px; height: 160px;
  background: rgba(0,0,0,0.15);
  border-radius: 2px;
}

.tree-trunk::after {
  content: '';
  position: absolute;
  right: 8px; top: 40px;
  width: 3px; height: 140px;
  background: rgba(255,255,255,0.07);
  border-radius: 2px;
}

/* Root base */
.tree-root {
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 64px; height: 12px;
  background: var(--trunk-dark);
  border-radius: 0 0 20px 20px;
}

/* ==========================================
   BRANCHES
   ========================================== */
/* All branches are positioned relative to
   the trunk */

/* LEFT MAIN BRANCH */
.branch-left {
  position: absolute;
  bottom: 155px;
  left: calc(50% - 28px);
  width: 90px; height: 14px;
  background: linear-gradient(
    90deg, var(--trunk), var(--branch));
  border-radius: 7px 2px 2px 7px;
  transform-origin: right center;
  transform: rotate(-28deg);
}

.branch-left::after {
  content: '';
  position: absolute;
  right: -22px; top: 0;
  width: 22px; height: 10px;
  background: var(--branch);
  border-radius: 0 5px 5px 0;
  transform: rotate(-15deg);
  transform-origin: left center;
}

/* LEFT SUB-BRANCH */
.branch-left-sub {
  position: absolute;
  bottom: 185px;
  left: calc(50% - 26px);
  width: 65px; height: 11px;
  background: linear-gradient(
    90deg, var(--trunk), var(--branch));
  border-radius: 5px 2px 2px 5px;
  transform-origin: right center;
  transform: rotate(-45deg);
}

/* RIGHT MAIN BRANCH */
.branch-right {
  position: absolute;
  bottom: 150px;
  right: calc(50% - 28px);
  width: 90px; height: 14px;
  background: linear-gradient(
    270deg, var(--trunk), var(--branch));
  border-radius: 2px 7px 7px 2px;
  transform-origin: left center;
  transform: rotate(28deg);
}

.branch-right::after {
  content: '';
  position: absolute;
  left: -22px; top: 0;
  width: 22px; height: 10px;
  background: var(--branch);
  border-radius: 5px 0 0 5px;
  transform: rotate(15deg);
  transform-origin: right center;
}

/* RIGHT SUB-BRANCH */
.branch-right-sub {
  position: absolute;
  bottom: 190px;
  right: calc(50% - 26px);
  width: 65px; height: 11px;
  background: linear-gradient(
    270deg, var(--trunk), var(--branch));
  border-radius: 2px 5px 5px 2px;
  transform-origin: left center;
  transform: rotate(45deg);
}

/* UPPER CENTRE BRANCH */
.branch-top-left {
  position: absolute;
  bottom: 225px;
  left: calc(50% - 20px);
  width: 55px; height: 10px;
  background: linear-gradient(
    90deg, var(--trunk), var(--branch));
  border-radius: 5px 2px 2px 5px;
  transform-origin: right center;
  transform: rotate(-55deg);
}

.branch-top-right {
  position: absolute;
  bottom: 225px;
  right: calc(50% - 20px);
  width: 55px; height: 10px;
  background: linear-gradient(
    270deg, var(--trunk), var(--branch));
  border-radius: 2px 5px 5px 2px;
  transform-origin: left center;
  transform: rotate(55deg);
}

/* ==========================================
   LEAVES (CSS only, decorative)
   ========================================== */
.leaf {
  position: absolute;
  width: 32px; height: 18px;
  background: var(--leaf);
  border-radius: 50% 5px 50% 5px;
  opacity: 0.85;
}

.leaf::after {
  content: '';
  position: absolute;
  top: 50%; left: 20%;
  width: 60%; height: 1px;
  background: var(--leaf-light);
  transform: translateY(-50%) rotate(-5deg);
}

.leaf-1 {
  bottom: 170px; left: 28px;
  transform: rotate(-20deg);
}
.leaf-2 {
  bottom: 200px; left: 18px;
  transform: rotate(-40deg);
}
.leaf-3 {
  bottom: 170px; right: 28px;
  transform: rotate(160deg);
}
.leaf-4 {
  bottom: 200px; right: 18px;
  transform: rotate(140deg);
}
.leaf-5 {
  bottom: 240px; left: 50%;
  margin-left: -40px;
  transform: rotate(-10deg);
}
.leaf-6 {
  bottom: 240px; left: 50%;
  margin-left: 8px;
  transform: rotate(10deg) scaleX(-1);
}
.leaf-7 {
  bottom: 290px; left: 50%;
  margin-left: -16px;
  transform: rotate(-5deg);
  width: 26px; height: 14px;
}

/* ==========================================
   COFFEE CHERRIES — the social link buttons
   ========================================== */
.cherry-link {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 52px; height: 52px;
  border-radius: 50%;
  text-decoration: none;
  background: radial-gradient(
    circle at 35% 35%,
    #C0392B 0%,
    var(--cherry) 50%,
    #5C0A0A 100%);
  border: 2px solid rgba(255,255,255,0.12);
  box-shadow:
    0 3px 10px rgba(0,0,0,0.5),
    inset 0 1px 3px rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.92);
  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease,
    background 0.3s ease,
    border-color 0.3s ease;
  z-index: 2;
  animation: cherryBob 3.5s
    ease-in-out infinite;
}

/* Stagger bob animations */
.cherry-link:nth-child(odd) {
  animation-delay: 0.4s;
}
.cherry-link:nth-child(3n) {
  animation-delay: 0.8s;
}

@keyframes cherryBob {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-4px); }
}

.cherry-link svg {
  width: 22px; height: 22px;
  display: block;
  pointer-events: none;
}

/* Cherry stem — tiny green line above */
.cherry-link::before {
  content: '';
  position: absolute;
  top: -10px; left: 50%;
  transform: translateX(-50%);
  width: 2px; height: 10px;
  background: var(--stem);
  border-radius: 1px;
}

/* Tooltip on hover */
.cherry-link::after {
  content: attr(data-label);
  position: absolute;
  bottom: calc(100% + 14px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(10,4,0,0.92);
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  white-space: nowrap;
  padding: 4px 9px;
  border-radius: 6px;
  border: 1px solid rgba(201,168,76,0.4);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease,
              transform 0.25s ease;
  transform: translateX(-50%)
             translateY(4px);
}

.cherry-link:hover::after {
  opacity: 1;
  transform: translateX(-50%)
             translateY(0);
}

/* Platform brand glow on hover */
.cherry-link:hover {
  transform: translateY(-6px) scale(1.15);
  animation-play-state: paused;
}

/* Twitter — white/dark */
.cherry-twitter:hover {
  background: radial-gradient(
    circle at 35% 35%,
    #444 0%, #111 50%, #000 100%);
  border-color: rgba(255,255,255,0.5);
  box-shadow:
    0 6px 20px rgba(0,0,0,0.6),
    0 0 16px rgba(255,255,255,0.2);
}

/* Telegram — blue */
.cherry-telegram:hover {
  background: radial-gradient(
    circle at 35% 35%,
    #29b6f6 0%, #0088cc 50%, #005580 100%);
  border-color: #29b6f6;
  box-shadow:
    0 6px 20px rgba(0,0,0,0.5),
    0 0 18px rgba(0,136,204,0.55);
}

/* Instagram — pink */
.cherry-instagram:hover {
  background: radial-gradient(
    circle at 35% 35%,
    #f77ab4 0%, #e1306c 50%, #833ab4 100%);
  border-color: #e1306c;
  box-shadow:
    0 6px 20px rgba(0,0,0,0.5),
    0 0 18px rgba(225,48,108,0.55);
}

/* TikTok — teal */
.cherry-tiktok:hover {
  background: radial-gradient(
    circle at 35% 35%,
    #69c9d0 0%, #010101 50%, #000 100%);
  border-color: #69c9d0;
  box-shadow:
    0 6px 20px rgba(0,0,0,0.6),
    0 0 18px rgba(105,201,208,0.45);
}

/* Medium — white */
.cherry-medium:hover {
  background: radial-gradient(
    circle at 35% 35%,
    #e0e0e0 0%, #555 50%, #111 100%);
  border-color: rgba(255,255,255,0.5);
  box-shadow:
    0 6px 20px rgba(0,0,0,0.5),
    0 0 14px rgba(255,255,255,0.2);
}

/* Reddit — orange */
.cherry-reddit:hover {
  background: radial-gradient(
    circle at 35% 35%,
    #ff8c69 0%, #ff4500 50%, #c03000 100%);
  border-color: #ff4500;
  box-shadow:
    0 6px 20px rgba(0,0,0,0.5),
    0 0 18px rgba(255,69,0,0.5);
}

/* Discord — indigo */
.cherry-discord:hover {
  background: radial-gradient(
    circle at 35% 35%,
    #8fa1ff 0%, #5865f2 50%, #3340c0 100%);
  border-color: #5865f2;
  box-shadow:
    0 6px 20px rgba(0,0,0,0.5),
    0 0 18px rgba(88,101,242,0.5);
}

/* Website — gold */
.cherry-website:hover {
  background: radial-gradient(
    circle at 35% 35%,
    var(--gold-light) 0%,
    var(--gold) 50%,
    var(--gold-dark) 100%);
  border-color: var(--gold);
  box-shadow:
    0 6px 20px rgba(0,0,0,0.5),
    0 0 18px rgba(201,168,76,0.55);
  color: var(--black);
}

/* ==========================================
   CHERRY POSITIONS on the tree
   Placed to look natural on branches
   ========================================== */

/* LEFT BRANCH cherries */
/* Twitter — far left branch tip */
.cherry-twitter {
  bottom: 185px;
  left: 22px;
}

/* Instagram — mid left branch */
.cherry-instagram {
  bottom: 220px;
  left: 52px;
}

/* Reddit — left sub-branch tip */
.cherry-reddit {
  bottom: 255px;
  left: 38px;
}

/* RIGHT BRANCH cherries */
/* Telegram — far right branch tip */
.cherry-telegram {
  bottom: 180px;
  right: 22px;
}

/* TikTok — mid right branch */
.cherry-tiktok {
  bottom: 215px;
  right: 52px;
}

/* Discord — right sub-branch */
.cherry-discord {
  bottom: 255px;
  right: 38px;
}

/* UPPER CENTRE cherries */
/* Website — crown of tree */
.cherry-website {
  bottom: 345px;
  left: 50%;
  transform: translateX(-50%);
}

/* Medium — upper left side */
.cherry-medium {
  bottom: 295px;
  left: 50%;
  margin-left: -48px;
}

/* ==========================================
   LABELS BELOW TREE
   ========================================== */
.lt-labels {
  width: 100%;
  max-width: 340px;
  margin: 8px auto 32px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px 4px;
  text-align: center;
}

.lt-label-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-decoration: none;
  color: rgba(255,255,255,0.75);
  font-size: 0.62rem;
  letter-spacing: 0.3px;
  transition: color 0.25s ease;
}

.lt-label-item:hover {
  color: var(--gold);
}

.lt-label-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--cherry);
  border: 1px solid rgba(255,255,255,0.2);
  flex-shrink: 0;
}

/* ==========================================
   FOOTER
   ========================================== */
.lt-footer {
  margin-top: 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.lt-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--gold);
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 600;
  opacity: 0.72;
  border: 1px solid rgba(201,168,76,0.3);
  padding: 8px 20px;
  border-radius: 20px;
  transition: opacity 0.3s ease,
              background 0.3s ease;
}

.lt-back:hover {
  opacity: 1;
  background: rgba(201,168,76,0.1);
}

.lt-copyright {
  font-size: 0.76rem;
  opacity: 0.32;
  line-height: 1.6;
}

/* ==========================================
   MOBILE — 480px and below
   Scale the tree down proportionally
   ========================================== */
@media (max-width: 480px) {
  .lt-wrap { padding: 36px 16px 52px; }
  .lt-logo { width: 72px; height: 72px; }
  .lt-name { font-size: 1.6rem; }

  .coffee-tree {
    width: 280px;
    height: 346px;
    transform-origin: bottom center;
    transform: scale(0.82);
    margin-bottom: -50px; /* compensate scale gap */
  }

  .lt-labels {
    max-width: 280px;
    grid-template-columns: repeat(4,1fr);
    font-size: 0.58rem;
  }
}

@media (max-width: 360px) {
  .coffee-tree {
    transform: scale(0.72);
    margin-bottom: -76px;
  }
}

  </style>
</head>

    <a href="https://www.instagram.com/toddycoin"

<!-- Sparkle particles — identical to main site -->
<script>
(function () {
  var canvas =
    document.getElementById('lt-canvas');
  if (!canvas) return;

  var ctx = canvas.getContext('2d');
  var W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener(
    'resize', resize, { passive: true });

  var TOTAL = 50;
  var pts   = [];

  function mkPt() {
    return {
      x:    Math.random() * W,
      y:    H + 4,
      r:    Math.random() * 2 + 0.5,
      vx:   (Math.random() - 0.5) * 0.35,
      vy:   -(Math.random() * 0.55 + 0.15),
      o:    Math.random() * 0.55 + 0.1,
      d:    Math.random() * 0.0022 + 0.001,
      gold: Math.random() > 0.5
    };
  }

  /* Seed with random positions */
  for (var i = 0; i < TOTAL; i++) {
    var p  = mkPt();
    p.y    = Math.random() * H;
    pts.push(p);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var j = 0; j < pts.length; j++) {
      var p = pts[j];
      p.x  += p.vx;
      p.y  += p.vy;
      p.o  -= p.d;
      if (p.o <= 0 || p.y < -8) {
        pts[j] = mkPt();
        continue;
      }
      ctx.beginPath();
      ctx.arc(
        p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.gold
        ? 'rgba(255,215,0,' + p.o + ')'
        : 'rgba(153,69,255,' + p.o + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
