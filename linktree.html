<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0" />
  <title>$TODDY — All Links</title>
  <meta name="description"
        content="All official $TODDY links —
        Website, Twitter, Telegram, Instagram,
        TikTok, Medium, Reddit, Discord." />
  <link rel="icon" type="image/png"
        href="assets/coin-logo.png" />
  <link rel="preconnect"
        href="https://fonts.googleapis.com" />
  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet" />

  <style>
    /* ========================================
       RESET & BASE
       ======================================== */
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
    }
    :root {
      --gold:       #C9A84C;
      --gold-light: #F0C96B;
      --purple:     #9945FF;
      --brown:      #1A0A00;
      --brown2:     #2C1500;
      --brown3:     #3d1900;
      --trunk:      #5C3317;
      --trunk-dark: #3B2008;
      --leaf:       #2D5A1B;
      --leaf-dark:  #1A3A0E;
      --cherry:     #8B1A1A;
      --cherry-hi:  #C0392B;
      --black:      #050505;
      --white:      #ffffff;
    }

    html, body {
      min-height: 100vh;
      background: var(--brown);
      font-family: 'Playfair Display', serif;
      color: var(--white);
      overflow-x: hidden;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 60%,
          rgba(153,69,255,0.07) 0%,
          transparent 55%),
        radial-gradient(ellipse at 80% 20%,
          rgba(201,168,76,0.05) 0%,
          transparent 55%);
      pointer-events: none; z-index: 0;
    }

    /* Sparkle canvas */
    #lt-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }

    /* ========================================
       PAGE WRAPPER
       ======================================== */
    .lt-wrap {
      position: relative; z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 44px 24px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ========================================
       HEADER
       ======================================== */
    .lt-logo {
      width: 82px; height: 82px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      box-shadow:
        0 0 0 6px rgba(201,168,76,0.1),
        0 0 28px rgba(201,168,76,0.4);
      margin-bottom: 14px;
      object-fit: cover;
    }
    .lt-name {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem; font-weight: 700;
      color: var(--gold); margin-bottom: 5px;
      text-align: center; letter-spacing: 1px;
    }
    .lt-tagline {
      font-size: 0.88rem; opacity: 0.65;
      text-align: center; font-style: italic;
      line-height: 1.5; margin-bottom: 6px;
    }
    .lt-divider {
      width: 50px; height: 2px;
      background: linear-gradient(
        90deg, transparent,
        var(--gold), transparent);
      margin-bottom: 32px; border-radius: 2px;
    }

    /* ========================================
       TREE LABEL
       ======================================== */
    .lt-tree-label {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      color: rgba(201,168,76,0.6);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 14px;
      text-align: center;
    }

    /* ========================================
       COFFEE TREE + TODDY INTERACTION STAGE
       ======================================== */
    .lt-social-stage {
      position: relative;
      width: 100%;
      max-width: 560px;
      min-height: 430px;
      margin: 0 auto 6px;
      overflow: visible;
    }

    .lt-tree-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 0;
      position: relative;
      z-index: 2;
    }

    /* The tree SVG scales with the container */
    .lt-tree-svg {
      width: 100%;
      max-width: 440px;
      height: auto;
      overflow: visible;
      /* Gentle sway on the whole canopy */
      animation: treeSway 6s
        ease-in-out infinite;
      transform-origin: 50% 95%;
    }

    @keyframes treeSway {
      0%, 100% { transform: rotate(0deg); }
      25%       { transform: rotate(0.8deg); }
      75%       { transform: rotate(-0.8deg); }
    }

    /* ========================================
       CHERRY LINKS — the clickable fruits
       Each <a> wraps a branded <circle> + <svg logo>
       ======================================== */
    .cherry-link {
      cursor: pointer;
    }

    /* Branded circular social buttons replace the old red cherry discs. */
    .cherry-base {
      fill: var(--social-color, #242424);
      stroke: rgba(255,255,255,0.72);
      stroke-width: 1.5;
      transition: all 0.3s ease;
      filter: drop-shadow(0 4px 9px rgba(0,0,0,0.55));
    }
    .cherry-website   { --social-color: #A98122; }
    .cherry-twitter   { --social-color: #080808; }
    .cherry-telegram  { --social-color: #229ED9; }
    .cherry-instagram { --social-color: #C13584; }
    .cherry-tiktok    { --social-color: #111111; }
    .cherry-medium    { --social-color: #080808; }
    .cherry-reddit    { --social-color: #FF4500; }
    .cherry-discord   { --social-color: #5865F2; }

    /* Cherry logo icon inside */
    .cherry-icon {
      fill: rgba(255,255,255,0.9);
      pointer-events: none;
    }

    /* Cherry hover — via SVG class toggle
       We use CSS :hover on the <a> wrapper */
    .cherry-link:hover .cherry-base {
      fill: var(--gold);
      stroke: var(--gold-light);
      stroke-width: 2;
      filter:
        drop-shadow(0 0 14px rgba(201,168,76,0.8))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
      transform-origin: center;
    }

    .cherry-link:hover .cherry-icon {
      fill: var(--black);
    }

    /* Platform-specific hover colours */
    .cherry-twitter:hover .cherry-base {
      fill: #000000; stroke: #ffffff;
      filter:
        drop-shadow(0 0 14px rgba(255,255,255,0.5))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }
    .cherry-twitter:hover .cherry-icon {
      fill: #ffffff;
    }

    .cherry-telegram:hover .cherry-base {
      fill: #0088cc; stroke: #4dcaf7;
      filter:
        drop-shadow(0 0 14px rgba(0,136,204,0.7))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }

    .cherry-instagram .cherry-base {
      fill: url(#instagramGradient);
    }
    .cherry-instagram:hover .cherry-base {
      fill: url(#instagramGradient); stroke: #ffffff;
      filter:
        drop-shadow(0 0 14px rgba(225,48,108,0.7))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }

    .cherry-tiktok:hover .cherry-base {
      fill: #010101; stroke: #69c9d0;
      filter:
        drop-shadow(0 0 14px rgba(105,201,208,0.7))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }
    .cherry-tiktok:hover .cherry-icon {
      fill: #69c9d0;
    }

    .cherry-medium:hover .cherry-base {
      fill: #000000; stroke: rgba(255,255,255,0.6);
      filter:
        drop-shadow(0 0 14px rgba(255,255,255,0.3))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }
    .cherry-medium:hover .cherry-icon {
      fill: #ffffff;
    }

    .cherry-reddit:hover .cherry-base {
      fill: #ff4500; stroke: #ff8060;
      filter:
        drop-shadow(0 0 14px rgba(255,69,0,0.7))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }

    .cherry-discord:hover .cherry-base {
      fill: #5865f2; stroke: #8fa1ff;
      filter:
        drop-shadow(0 0 14px rgba(88,101,242,0.7))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }

    .cherry-dex:hover .cherry-base {
      fill: var(--gold); stroke: var(--gold-light);
      filter:
        drop-shadow(0 0 14px rgba(201,168,76,0.8))
        drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }
    .cherry-dex:hover .cherry-icon {
      fill: var(--black);
    }

    /* ========================================
       TODDY SOCIAL INTERACTION GUIDE
       Toddy sits to the LEFT of the tree and reaches
       toward the lower-left Medium button.  The
       character is mirrored so the raised paw points
       inward toward the tree.
       ======================================== */
    .lt-toddy-guide {
      position: absolute;
      left: 4px;
      top: 138px;
      width: 190px;
      margin: 0;
      z-index: 3;
      pointer-events: none;
    }

    .lt-toddy-guide img {
      display: block;
      width: 190px;
      height: auto;
      max-width: none;
      transform: scaleX(-1);
      transform-origin: center bottom;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.22));
    }

    /* Desktop: keep the tree centred as before; Toddy occupies the
       open lower-left space without sitting behind the trunk. */
    @media (min-width: 769px) {
      .lt-social-stage {
        min-height: 430px;
      }

      .lt-tree-wrap {
        margin-bottom: 0;
      }

      .lt-tree-svg {
        max-width: 440px;
      }

      .lt-toddy-guide {
        left: 4px;
        top: 136px;
        width: 190px;
      }

      .lt-toddy-guide img {
        width: 190px;
      }
    }

    /* ========================================
       FOOTER
       ======================================== */
    .lt-footer {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .lt-back {
      display: inline-flex;
      align-items: center; gap: 6px;
      color: var(--gold); text-decoration: none;
      font-size: 0.88rem; font-weight: 600;
      opacity: 0.72;
      border: 1px solid rgba(201,168,76,0.3);
      padding: 8px 20px; border-radius: 20px;
      transition: opacity 0.3s ease,
                  background 0.3s ease;
    }
    .lt-back:hover {
      opacity: 1;
      background: rgba(201,168,76,0.1);
    }

    .lt-copyright {
      font-size: 0.76rem; opacity: 0.35;
    }

    /* ========================================
       TOOLTIP on cherry hover (CSS only)
       ======================================== */
    .cherry-link {
      position: relative;
    }

    /* ========================================
       MOBILE SCALING
       The tree shifts slightly RIGHT so Toddy remains
       visible on the LEFT while the complete tree and
       all social buttons stay inside the viewport.
       Desktop layout is not affected.
       ======================================== */
    @media (max-width: 480px) {
      .lt-wrap { padding: 36px 12px 48px; }
      .lt-logo { width: 68px; height: 68px; }
      .lt-name { font-size: 1.5rem; }

      .lt-social-stage {
        width: calc(100% + 24px);
        margin-left: -12px;
        min-height: 350px;
      }

      .lt-tree-wrap {
        width: calc(100% - 24px);
        margin-left: 24px;
        justify-content: center;
      }

      .lt-tree-svg {
        width: 100%;
        max-width: none;
      }

      .lt-toddy-guide {
        left: 0;
        top: 116px;
        width: 150px;
      }

      .lt-toddy-guide img {
        width: 150px;
      }
    }

    @media (max-width: 360px) {
      .lt-social-stage {
        min-height: 330px;
      }

      .lt-toddy-guide {
        top: 108px;
        width: 138px;
      }

      .lt-toddy-guide img {
        width: 138px;
      }
    }
  </style>
</head>
<body>

<canvas id="lt-canvas"></canvas>

<div class="lt-wrap">

  <!-- Header -->
  <img src="assets/coin-logo.png"
       alt="$TODDY Logo" class="lt-logo" />
  <div class="lt-name">$TODDY</div>
  <p class="lt-tagline">
    The Night Trader of Crypto ☕🌙<br />
    Kopi Luwak Meme Coin on Solana
  </p>
  <div class="lt-divider"></div>

  <p class="lt-tree-label">
    🌿 Tap a social button to visit
  </p>

  <!-- =============================================
       COFFEE TREE — pure inline SVG
       ViewBox: 0 0 480 420
       Origin bottom-centre of trunk
       
       STRUCTURE:
       - Trunk: rect rising from bottom-centre
       - Main branches: path curves left/right
       - Sub-branches: shorter curves
       - Leaf clusters: ellipses in dark green
       - 8 branded circular social buttons with SVG logos
       
       Cherry positions (cx, cy):
       1. Website   — top-centre     (240, 55)
       2. Twitter   — upper-left     (130, 95)
       3. Telegram  — upper-right    (350, 95)
       4. Instagram — mid-left       ( 80, 155)
       5. TikTok    — mid-right      (400, 155)
       6. Medium    — lower-left     (140, 225)
       7. Reddit    — lower-right    (340, 225)
       8. Discord   — bottom-centre  (240, 280)
       ============================================= -->

  <div class="lt-social-stage">
    <div class="lt-tree-wrap">
      <svg class="lt-tree-svg"
         viewBox="0 0 480 420"
         xmlns="http://www.w3.org/2000/svg"
         role="img"
         aria-label="Toddy Coffee Tree with social links">

      <defs>
        <!-- Instagram's familiar warm-to-violet brand gradient -->
        <linearGradient id="instagramGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FEDA75" />
          <stop offset="24%" stop-color="#FA7E1E" />
          <stop offset="55%" stop-color="#D62976" />
          <stop offset="78%" stop-color="#962FBF" />
          <stop offset="100%" stop-color="#4F5BD5" />
        </linearGradient>
      </defs>

      <!-- ======= TRUNK ======= -->
      <!-- Main trunk -->
      <rect x="226" y="300" width="28"
            height="110" rx="6"
            fill="#5C3317"/>
      <!-- Trunk shading -->
      <rect x="226" y="300" width="10"
            height="110" rx="4"
            fill="rgba(0,0,0,0.2)"/>
      <!-- Trunk highlight -->
      <rect x="240" y="300" width="6"
            height="110" rx="3"
            fill="rgba(255,255,255,0.08)"/>

      <!-- ======= ROOT BASE ======= -->
      <ellipse cx="240" cy="408" rx="55" ry="8"
               fill="rgba(92,51,23,0.5)"/>

      <!-- ======= MAIN BRANCHES ======= -->

      <!-- Centre-up branch (to top cherry) -->
      <path d="M 240 300 C 240 260 240 220 240 130"
            stroke="#5C3317" stroke-width="10"
            fill="none" stroke-linecap="round"/>

      <!-- Left main branch -->
      <path d="M 240 290 C 220 260 180 230 120 200"
            stroke="#5C3317" stroke-width="9"
            fill="none" stroke-linecap="round"/>

      <!-- Right main branch -->
      <path d="M 240 290 C 260 260 300 230 360 200"
            stroke="#5C3317" stroke-width="9"
            fill="none" stroke-linecap="round"/>

      <!-- Left upper branch -->
      <path d="M 230 240 C 200 210 160 175 100 155"
            stroke="#6B3D1E" stroke-width="7"
            fill="none" stroke-linecap="round"/>

      <!-- Right upper branch -->
      <path d="M 250 240 C 280 210 320 175 390 155"
            stroke="#6B3D1E" stroke-width="7"
            fill="none" stroke-linecap="round"/>

      <!-- Left upper sub-branch -->
      <path d="M 200 200 C 175 175 148 145 115 100"
            stroke="#7A4A22" stroke-width="5"
            fill="none" stroke-linecap="round"/>

      <!-- Right upper sub-branch -->
      <path d="M 280 200 C 305 175 332 145 365 100"
            stroke="#7A4A22" stroke-width="5"
            fill="none" stroke-linecap="round"/>

      <!-- Centre upper branch (to website) -->
      <path d="M 240 180 C 240 150 240 120 240 80"
            stroke="#7A4A22" stroke-width="5"
            fill="none" stroke-linecap="round"/>

      <!-- Left lower sub-branch -->
      <path d="M 155 235 C 148 228 143 224 140 222"
            stroke="#7A4A22" stroke-width="4"
            fill="none" stroke-linecap="round"/>

      <!-- Right lower sub-branch -->
      <path d="M 325 235 C 332 228 337 224 340 222"
            stroke="#7A4A22" stroke-width="4"
            fill="none" stroke-linecap="round"/>

      <!-- Discord/bottom branch -->
      <path d="M 240 295 C 240 288 240 284 240 278"
            stroke="#7A4A22" stroke-width="5"
            fill="none" stroke-linecap="round"/>

      <!-- ======= LEAF CLUSTERS ======= -->
      <!-- These are ellipses grouped around
           each cherry to look like foliage -->

      <!-- Top cluster -->
      <ellipse cx="240" cy="60" rx="52" ry="38"
               fill="#2D5A1B" opacity="0.9"/>
      <ellipse cx="215" cy="48" rx="32" ry="24"
               fill="#3A7A22" opacity="0.7"/>
      <ellipse cx="265" cy="48" rx="32" ry="24"
               fill="#3A7A22" opacity="0.7"/>
      <ellipse cx="240" cy="40" rx="28" ry="20"
               fill="#4A8A2C" opacity="0.6"/>

      <!-- Upper-left cluster -->
      <ellipse cx="120" cy="100" rx="46" ry="34"
               fill="#2D5A1B" opacity="0.9"/>
      <ellipse cx="100" cy="88"  rx="28" ry="21"
               fill="#3A7A22" opacity="0.7"/>
      <ellipse cx="140" cy="88"  rx="28" ry="21"
               fill="#3A7A22" opacity="0.7"/>

      <!-- Upper-right cluster -->
      <ellipse cx="360" cy="100" rx="46" ry="34"
               fill="#2D5A1B" opacity="0.9"/>
      <ellipse cx="340" cy="88"  rx="28" ry="21"
               fill="#3A7A22" opacity="0.7"/>
      <ellipse cx="380" cy="88"  rx="28" ry="21"
               fill="#3A7A22" opacity="0.7"/>

      <!-- Mid-left cluster -->
      <ellipse cx="72"  cy="158" rx="40" ry="30"
               fill="#2D5A1B" opacity="0.85"/>
      <ellipse cx="55"  cy="148" rx="24" ry="18"
               fill="#3A7A22" opacity="0.7"/>
      <ellipse cx="90"  cy="148" rx="24" ry="18"
               fill="#3A7A22" opacity="0.7"/>

      <!-- Mid-right cluster -->
      <ellipse cx="408" cy="158" rx="40" ry="30"
               fill="#2D5A1B" opacity="0.85"/>
      <ellipse cx="390" cy="148" rx="24" ry="18"
               fill="#3A7A22" opacity="0.7"/>
      <ellipse cx="425" cy="148" rx="24" ry="18"
               fill="#3A7A22" opacity="0.7"/>

      <!-- Lower-left cluster -->
      <ellipse cx="130" cy="228" rx="40" ry="28"
               fill="#2D5A1B" opacity="0.8"/>
      <ellipse cx="115" cy="218" rx="24" ry="17"
               fill="#3A7A22" opacity="0.65"/>

      <!-- Lower-right cluster -->
      <ellipse cx="350" cy="228" rx="40" ry="28"
               fill="#2D5A1B" opacity="0.8"/>
      <ellipse cx="365" cy="218" rx="24" ry="17"
               fill="#3A7A22" opacity="0.65"/>

      <!-- Bottom cluster (around Discord) -->
      <ellipse cx="240" cy="282" rx="38" ry="26"
               fill="#2D5A1B" opacity="0.75"/>
      <ellipse cx="220" cy="274" rx="22" ry="16"
               fill="#3A7A22" opacity="0.6"/>
      <ellipse cx="260" cy="274" rx="22" ry="16"
               fill="#3A7A22" opacity="0.6"/>

      <!-- ======= BRANDED SOCIAL BUTTONS WITH LINKS ======= -->
      <!-- Each social button = <a> > branded circle + SVG logo -->
      <!-- Social button radius = 26 SVG units (same size and position as the former cherries).
            Logos are scaled to 1.12 and centred within each branded circle. -->

      <!-- 1. WEBSITE — top centre (240, 55) -->
      <a href="https://toddy.meme/"
         class="cherry-link cherry-website" aria-label="Website"
         target="_blank"
         rel="noopener noreferrer">
        <title>Official Website — toddy.meme</title>
        <circle class="cherry-base"
                cx="240" cy="55" r="26"/>
        <!-- Globe icon -->
        <g class="cherry-icon"
           transform="translate(240,55) scale(1.12) translate(-12,-12)">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10
            10 10 10-4.48 10-10S17.52 2 12 2zm-1
            17.93c-3.95-.49-7-3.85-7-7.93
            0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9
            2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39
            -1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2
            c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41
            c2.93 1.19 5 4.06 5 7.41 0 2.08-.8
            3.97-2.1 5.39z"/>
        </g>
      </a>

      <!-- 2. TWITTER — upper left (120, 100) -->
      <a href="https://x.com/ToddyCoin"
         class="cherry-link cherry-twitter" aria-label="Twitter / X"
         target="_blank"
         rel="noopener noreferrer">
        <title>Twitter / X — @ToddyCoin</title>
        <circle class="cherry-base"
                cx="120" cy="100" r="26"/>
        <!-- X logo -->
        <g class="cherry-icon"
           transform="translate(120,100) scale(1.12) translate(-12,-12)">
          <path d="M18.244 2.25h3.308l-7.227
            8.26 8.502 11.24H16.17l-4.714-6.231
            -5.401 6.231H2.748l7.73-8.835L1.254
            2.25H8.08l4.253 5.622zm-1.161
            17.52h1.833L7.084 4.126H5.117z"/>
        </g>
      </a>

      <!-- 3. TELEGRAM — upper right (360, 100) -->
      <a href="https://t.me/ToddyCoinCommunity"
         class="cherry-link cherry-telegram" aria-label="Telegram"
         target="_blank"
         rel="noopener noreferrer">
        <title>Telegram — Night Traders Community</title>
        <circle class="cherry-base"
                cx="360" cy="100" r="26"/>
        <g class="cherry-icon"
           transform="translate(360,100) scale(1.12) translate(-12,-12)">
          <path d="M11.944 0A12 12 0 0 0 0 12a12
            12 0 0 0 12 12 12 12 0 0 0 12-12A12 12
            0 0 0 12 0a12 12 0 0 0-.056 0zm4.962
            7.224c.1-.002.321.023.465.14a.506.506
            0 0 1 .171.325c.016.093.036.306.02.472
            -.18 1.898-.962 6.502-1.36 8.627-.168.9
            -.499 1.201-.82 1.23-.696.065-1.225-.46
            -1.9-.902-1.056-.693-1.653-1.124-2.678
            -1.8-1.185-.78-.417-1.21.258-1.91.177
            -.184 3.247-2.977 3.307-3.23.007-.032

<!-- Sparkle particles — matching main site -->
<script>
(function() {
  var canvas = document.getElementById('lt-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize,
    { passive: true });

  var pts = [];
  var TOTAL = 50;

  function mkPt() {
    return {
      x:    Math.random() * W,
      y:    H + 4,
      r:    Math.random() * 2 + 0.5,
      vx:   (Math.random() - 0.5) * 0.35,
      vy:   -(Math.random() * 0.55 + 0.15),
      o:    Math.random() * 0.55 + 0.1,
      d:    Math.random() * 0.0022 + 0.001,
      gold: Math.random() > 0.5
    };
  }

  /* Seed across full page height */
  for (var i = 0; i < TOTAL; i++) {
    var p = mkPt();
    p.y = Math.random() * H;
    pts.push(p);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var j = 0; j < pts.length; j++) {
      var p = pts[j];
      p.x += p.vx;
      p.y += p.vy;
      p.o -= p.d;
      if (p.o <= 0 || p.y < -8) {
        pts[j] = mkPt();
        continue;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.gold
        ? 'rgba(255,215,0,' + p.o + ')'
        : 'rgba(153,69,255,' + p.o + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
